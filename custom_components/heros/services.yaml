        text:
    solar_hero_mapping:
      name: Solar Hero Mapping
      description: JSON object containing persisted solar hero mapping overrides.
      required: false
      selector:
        text:
    entry_id:
      name: Integration ID
      description: Required only if multiple accounts are configured.
      example: "abcdef1234"
      required: false
      selector:
        text:

