          domain: sensor
    forecast_generation_tomorrow_entity:
      name: Tomorrow Entity
      description: Sensor for estimated energy production tomorrow.
      required: false
      selector:
        entity:
          domain: sensor
    forecast_generation_this_hour_entity:
      name: This Hour Entity
      description: Sensor for estimated energy production this hour.
      required: false
      selector:
        entity:
          domain: sensor
    forecast_generation_next_hour_entity:
      name: Next Hour Entity
      description: Sensor for estimated energy production next hour.
      required: false
      selector:
        entity:
          domain: sensor
    forecast_generation_remaining_today_entity:
      name: Remaining Today Entity
      description: Sensor for estimated energy production remaining today.
      required: false
      selector:
        entity:
          domain: sensor
